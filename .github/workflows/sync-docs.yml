---
name: sync docs
# Nightly: re-sync content/docs/keycloak/ from keelinfra/keycloak and commit if
# anything changed (the push triggers deploy.yml). Keeps the site's docs never
# more than ~24h behind the product repo, with a reviewable commit trail.
on:
  schedule:
    - cron: "45 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Sync docs from keelinfra/keycloak
        run: python3 scripts/sync_docs.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "docs already in sync"
            exit 0
          fi
          sha=$(git diff -U0 -- content/docs | grep -oE 'keelinfra/keycloak@[0-9a-f]+' | head -1 | cut -d@ -f2)
          git config user.name "keelinfra-bot"
          git config user.email "hello@keelinfra.io"
          git add content/docs
          git commit -m "docs: sync from keelinfra/keycloak@${sha:-main}"
          git push
